;; openg2p-test PgBouncer on pg-primary-01 (2026-11-18, runbook step J). Package pgbouncer 1.22.0-1build4 (apt-mark hold).
;; Pools the farmer registry's connections (staff API, partner API, Celery worker + beat). Everything else
;; still connects to PostgreSQL :5432 directly through HAProxy. Apps reach this via HAProxy db-proxy :6432.
[databases]
farmer_registry = host=127.0.0.1 port=5432 dbname=farmer_registry

[pgbouncer]
listen_addr = 10.0.30.10,127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = hba
auth_hba_file = /etc/pgbouncer/pgbouncer_hba.conf
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

;; transaction pooling; protocol-level prepared statements (asyncpg) are tracked per server connection
pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 2000
default_pool_size = 60
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 80
server_lifetime = 3600
server_idle_timeout = 600
query_wait_timeout = 120
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
stats_period = 60
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
