# Grafana dashboard, loaded by the rancher-monitoring dashboard sidecar (label grafana_dashboard=1 in cattle-dashboards).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openg2p-test-data-services
  namespace: cattle-dashboards
  labels: {grafana_dashboard: "1"}
data:
  openg2p-test-data-services.json: |
    {
     "title": "openg2p-test \u2014 Data services",
     "uid": "openg2p-test-data-services",
     "tags": [
      "openg2p-test",
      "postgres",
      "minio"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "version": 1,
     "editable": true,
     "refresh": "30s",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "datasource",
        "type": "datasource",
        "query": "prometheus",
        "label": "Data source",
        "hide": 0,
        "current": {
         "selected": true,
         "text": "Prometheus",
         "value": "prometheus"
        }
       }
      ]
     },
     "panels": [
      {
       "type": "text",
       "title": "",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 3
       },
       "id": 1,
       "options": {
        "mode": "markdown",
        "content": "**Data services outside Kubernetes** \u2014 PostgreSQL 16 primary `pg-primary-01` (10.0.30.10) with streaming replica `pg-replica-01` (10.0.30.11), and MinIO on `minio-01` (10.0.30.20). Measured by exporters in namespace **infra** on observability-01. Connections are attributed to the **instance** they come from: PostgreSQL sees the node IP, mapped to its name. Alerts: Rancher \u2192 Monitoring \u2192 Alertmanager (rules: `infra/data-services`)."
       }
      },
      {
       "type": "row",
       "title": "PostgreSQL",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 3,
        "w": 24,
        "h": 1
       },
       "id": 2,
       "panels": []
      },
      {
       "type": "stat",
       "title": "Primary",
       "description": "pg-primary-01 answers the exporter",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 3,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "pg_up{pg_role=\"primary\"}",
         "legendFormat": "",
         "refId": "D",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "UP",
             "color": "#0ca30c"
            },
            "0": {
             "text": "DOWN",
             "color": "#d03b3b"
            }
           }
          },
          {
           "type": "special",
           "options": {
            "match": "null",
            "result": {
             "text": "NO DATA",
             "color": "#ec835a"
            }
           }
          }
         ],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#ec835a",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Replica",
       "description": "pg-replica-01 answers the exporter",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 5,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "pg_up{pg_role=\"replica\"}",
         "legendFormat": "",
         "refId": "F",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "UP",
             "color": "#0ca30c"
            },
            "0": {
             "text": "DOWN",
             "color": "#d03b3b"
            }
           }
          },
          {
           "type": "special",
           "options": {
            "match": "null",
            "result": {
             "text": "NO DATA",
             "color": "#ec835a"
            }
           }
          }
         ],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#ec835a",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Replica mode",
       "description": "STANDBY = in recovery, read-only, following the primary. PROMOTED = writable \u2014 split-brain risk.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 7,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "pg_replication_is_replica{pg_role=\"replica\"}",
         "legendFormat": "",
         "refId": "H",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "STANDBY",
             "color": "#0ca30c"
            },
            "0": {
             "text": "PROMOTED",
             "color": "#d03b3b"
            }
           }
          },
          {
           "type": "special",
           "options": {
            "match": "null",
            "result": {
             "text": "NO DATA",
             "color": "#ec835a"
            }
           }
          }
         ],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#ec835a",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Replication lag",
       "description": "Seconds the replica is behind. 0 when caught up, including when the primary is idle.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 9,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "max(pg_replication_lag_seconds{pg_role=\"replica\"})",
         "legendFormat": "",
         "refId": "J",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "decimals": 1,
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#0ca30c",
            "value": null
           },
           {
            "color": "#fab219",
            "value": 30
           },
           {
            "color": "#d03b3b",
            "value": 60
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Connections used",
       "description": "Client connections on the primary as a share of max_connections (300).",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 11,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "(sum(pg_clients_connections{pg_role=\"primary\"}) or vector(0)) / max(pg_settings_max_connections{pg_role=\"primary\"})",
         "legendFormat": "",
         "refId": "L",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "decimals": 1,
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#0ca30c",
            "value": null
           },
           {
            "color": "#fab219",
            "value": 0.6
           },
           {
            "color": "#ec835a",
            "value": 0.8
           },
           {
            "color": "#d03b3b",
            "value": 0.9
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "WAL held for replica",
       "description": "WAL the primary keeps for slot pg_replica_01. Capped at 20 GB (max_slot_wal_keep_size).",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 20,
        "y": 4,
        "w": 4,
        "h": 4
       },
       "id": 13,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "max(pg_slots_retained_bytes{pg_role=\"primary\"})",
         "legendFormat": "",
         "refId": "N",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "decimals": 1,
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#0ca30c",
            "value": null
           },
           {
            "color": "#fab219",
            "value": 5368709120
           },
           {
            "color": "#d03b3b",
            "value": 10737418240
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "timeseries",
       "title": "Connections to the primary, by instance",
       "description": "Which instance each client connection comes from. Farmer should appear only as farmer-app-01, Commons only as commons-app-01, ODK only as odk-central-01.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 14,
        "h": 9
       },
       "id": 16,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (client_instance) (pg_clients_connections{pg_role=\"primary\"})",
         "legendFormat": "{{client_instance}}",
         "refId": "O"
        }
       ],
       "options": {
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        },
        "legend": {
         "showLegend": true,
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "color": {
          "mode": "fixed",
          "fixedColor": "#3987e5"
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 0,
          "showPoints": "never",
          "spanNulls": true,
          "axisSoftMin": 0
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "farmer-app-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#3987e5"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "commons-app-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#d95926"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "odk-central-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#199e70"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "rke2-cp-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#c98500"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "observability-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#d55181"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "backup-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#008300"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "pg-replica-01"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "#9085e9"
            }
           }
          ]
         }
        ]
       }
      },
      {
       "type": "table",
       "title": "Connections now \u2014 instance \u00b7 database \u00b7 role",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 14,
        "y": 8,
        "w": 10,
        "h": 9
       },
       "id": 17,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (client_instance, datname, usename) (pg_clients_connections{pg_role=\"primary\"})",
         "legendFormat": "",
         "refId": "R",
         "instant": true,
         "range": false,
         "format": "table"
        }
       ],
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true
          },
          "renameByName": {
           "client_instance": "Instance",
           "datname": "Database",
           "usename": "Role",
           "Value": "Connections"
          },
          "indexByName": {
           "client_instance": 0,
           "datname": 1,
           "usename": 2,
           "Value": 3
          }
         }
        }
       ],
       "options": {
        "showHeader": true,
        "sortBy": [
         {
          "displayName": "Connections",
          "desc": true
         }
        ]
       },
       "fieldConfig": {
        "defaults": {
         "custom": {
          "align": "auto"
         }
        },
        "overrides": []
       }
      },
      {
       "type": "timeseries",
       "title": "Replication lag \u2014 pg-replica-01",
       "description": "Seconds behind the primary.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 17,
        "w": 12,
        "h": 8
       },
       "id": 20,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "pg_replication_lag_seconds{pg_role=\"replica\"}",
         "legendFormat": "lag",
         "refId": "S"
        }
       ],
       "options": {
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        },
        "legend": {
         "showLegend": false,
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "min": 0,
         "color": {
          "mode": "fixed",
          "fixedColor": "#3987e5"
         },
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 0,
          "showPoints": "never",
          "spanNulls": true,
          "axisSoftMin": 0
         }
        },
        "overrides": []
       }
      },
      {
       "type": "bargauge",
       "title": "Database size \u2014 primary",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 17,
        "w": 12,
        "h": 8
       },
       "id": 21,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (datname) (pg_database_size_bytes{pg_role=\"primary\", datname!~\"template.*\"})",
         "legendFormat": "{{datname}}",
         "refId": "V",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "orientation": "horizontal",
        "displayMode": "basic",
        "showUnfilled": true,
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "min": 0,
         "color": {
          "mode": "fixed",
          "fixedColor": "#3987e5"
         }
        },
        "overrides": []
       }
      },
      {
       "type": "row",
       "title": "MinIO \u2014 minio-01",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 25,
        "w": 24,
        "h": 1
       },
       "id": 23,
       "panels": []
      },
      {
       "type": "stat",
       "title": "MinIO",
       "description": "Metrics endpoint on minio-01:9000 answers",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 26,
        "w": 6,
        "h": 4
       },
       "id": 24,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "up{namespace=\"infra\", job=\"minio\"}",
         "legendFormat": "",
         "refId": "Y",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "UP",
             "color": "#0ca30c"
            },
            "0": {
             "text": "DOWN",
             "color": "#d03b3b"
            }
           }
          },
          {
           "type": "special",
           "options": {
            "match": "null",
            "result": {
             "text": "NO DATA",
             "color": "#ec835a"
            }
           }
          }
         ],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#ec835a",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Cluster health",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 6,
        "y": 26,
        "w": 6,
        "h": 4
       },
       "id": 26,
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "minio_cluster_health_status",
         "legendFormat": "",
         "refId": "A",
         "instant": true,
         "range": false
        }
       ],
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "HEALTHY",
             "color": "#0ca30c"
            },
            "0": {
             "text": "UNHEALTHY",
             "color": "#d03b3b"
            }
           }
          },
          {
           "type": "special",
           "options": {
            "match": "null",
            "result": {
             "text": "NO DATA",
             "color": "#ec835a"
            }
           }
          }
         ],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "#ec835a",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
       "title": "Disk used",
       "description": "Share of /data (100 GB) used",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 26,
        "w": 6,
        "h": 4
       },
       "id": 28,
       "targets": [
        {
