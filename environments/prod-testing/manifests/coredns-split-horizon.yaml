# Split-horizon DNS for ati-uat.oanstaging.com (INSTALL-RUNBOOK step 10).
# Route53 answers *.ati-uat with the RP's PUBLIC IP, so a pod calling https://keycloak.ati-uat…
# would leave through nat-01 and come back in over the internet. Inside the cluster every
# *.ati-uat name resolves to the RP's PRIVATE address 10.0.10.10 instead — the same nginx, the
# same certificate, no hairpin. AAAA answers are empty (no IPv6 here).
#
# The first server block is the rke2-coredns chart default, unchanged: `servers` replaces the
# whole list, so it has to be repeated.
#
# Tolerations: CoreDNS runs 2 replicas with required anti-affinity (one per node), but since
# step 5 every worker carries an openg2p.org/pool taint, so only rke2-cp-01 was eligible and the
# 2nd replica stayed Pending. It may now also use observability-01 (shared infra), never the
# app nodes. The first two entries are the chart defaults (`tolerations` replaces the list).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: kube-system
spec:
  valuesContent: |-
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/etcd
      operator: Exists
      effect: NoExecute
    - key: openg2p.org/pool
      operator: Equal
      value: observability
      effect: NoSchedule
    servers:
    - zones:
      - zone: .
        use_tcp: true
      port: 53
      plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 10s
      - name: ready
      - name: kubernetes
        parameters: in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
          ttl 30
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
    - zones:
      - zone: ati-uat.oanstaging.com.
      port: 53
      plugins:
      - name: errors
      - name: template
        parameters: IN A ati-uat.oanstaging.com.
        configBlock: |-
          answer "{{ .Name }} 60 IN A 10.0.10.10"
      - name: template
        parameters: IN AAAA ati-uat.oanstaging.com.
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
