# prod-testing — farmer registry (chart charts/openg2p-farmer-registry on this branch).
# Release `farmer-registry`, namespace `farmer`. Install with TWO files, this one last:
#   -f environments/prod-testing/values/farmer-gateways.yaml   (istio-system/development → test/internal)
#   -f environments/prod-testing/values/farmer.yaml
#
# The settings validated by the 1M-farmer load tests (2026-11-05 … 11-18): resources, autoscalers, Celery worker
# options, PgBouncer port, worker AWE, permanent search index and DB role settings. No secrets here; pre-created in
# `farmer`: commons-postgresql, commons-minio, commons-keycloak, awe-db-user, master-data-db-user (see README.md).
#
# Images are pinned to the build that was tested (90811b61a59f, 2026-10-16), NOT the chart's newer defaults, so an
# install reproduces the tested state. Bump them together with analytics.reportingViews (below).
global:
  baseDomain: ati-uat.oanstaging.com
  # Browser-facing S3 endpoint: the registry hands browsers pre-signed URLs and SigV4 signs the Host header,
  # so this must be the public name (minio-01 via the reverse proxy), not an in-cluster one.
  minioHost: minio.ati-uat.oanstaging.com
  minioSecure: true

# Superset is not installed here; the fr-dashboards hook would wait for its Secrets.
# Reporting views OFF: their SQL needs g2p_register_farmers.income_sources, which the pinned images (90811b61a59f)
# do not create. Turn back on together with an image bump.
analytics:
  dashboards:
    enabled: false
  reportingViews:
    enabled: false

registry:
  staffUi:
    image:
      tag: 90811b61a59f@sha256:e7e5c7d8d0935f8e2957019afe68cad168de8d08f34b52cffc8c91fe92d7cbc4
    envVars:
      # Images come from MinIO and map tiles; elevation lookup for the location pin.
      CSP_SRC_IMG: 'self blob: data: https://minio.ati-uat.oanstaging.com https://tile.openstreetmap.org'
      CSP_SRC_CONNECT: 'self https://api.open-meteo.com'

  staffApi:
    image:
      tag: 90811b61a59f@sha256:b8116e52f51c85d228d26ab97113b75cf293a9dfba120a062c16d97727039ed5
    replicaCount: 1                      # = autoscaling.staffApi.minReplicas
    # Request = what the autoscaler measures against. No CPU limit: a pod uses ~3 cores under load (3 workers).
    # Memory: idles at ~540 Mi.
    resources:
      requests: {cpu: 1500m, memory: 595Mi}
      limits: {memory: 1536Mi}
    autoscaling:
      enabled: false                     # the chart-level `autoscaling.staffApi` below is used instead
    envVars:
      # db-proxy HAProxy :6432 → PgBouncer (transaction pooling) on the primary; :5432 = PostgreSQL direct
      REGISTRY_STAFF_PORTAL_API_DB_PORT: "6432"
      # DB connections per worker process: up to POOL_SIZE + MAX_OVERFLOW = 15 (values as running; same as the chart
      # defaults, recorded here). Through PgBouncer these are cheap client connections; PostgreSQL sees at most 80.
      REGISTRY_STAFF_PORTAL_API_DB_POOL_SIZE: "5"
      REGISTRY_STAFF_PORTAL_API_DB_POOL_MAX_OVERFLOW: "10"
      REGISTRY_STAFF_PORTAL_API_DB_POOL_RECYCLE: "1800"
      REGISTRY_STAFF_PORTAL_API_DB_POOL_PRE_PING: "true"
      STAFF_PORTAL_NO_OF_WORKERS: "3"                  # → up to 45 DB connections per pod

  partnerApi:
    image:
      tag: 90811b61a59f@sha256:800b7b097a4fd8bf7a09ef0e24969ed374e0126933d9aa79c47e186644f4315c
    replicaCount: 1
    resources:
      requests: {cpu: 1000m, memory: 640Mi}
      limits: {memory: 1280Mi}
    autoscaling:
      enabled: false
    envVars:
      REGISTRY_PARTNER_API_DB_PORT: "6432"
      # DB connections per worker process: up to POOL_SIZE + MAX_OVERFLOW = 15 (values as running; same as the chart
      # defaults, recorded here). Through PgBouncer these are cheap client connections; PostgreSQL sees at most 80.
      REGISTRY_PARTNER_API_DB_POOL_SIZE: "5"
      REGISTRY_PARTNER_API_DB_POOL_MAX_OVERFLOW: "10"
      REGISTRY_PARTNER_API_DB_POOL_RECYCLE: "1800"
      REGISTRY_PARTNER_API_DB_POOL_PRE_PING: "true"
      PARTNER_NO_OF_WORKERS: "3"                       # → up to 45 DB connections per pod

  celeryBeat:
    image:
      tag: 90811b61a59f@sha256:15273f1e29b54f02df09b0bb69c5cf21d68432c1c34f0dd6521a1fbfe64b49c2
    envVars:
      REGISTRY_CELERY_BEAT_DB_PORT: "6432"
      # DB connections per worker process: up to POOL_SIZE + MAX_OVERFLOW = 15 (values as running; same as the chart
      # defaults, recorded here). Through PgBouncer these are cheap client connections; PostgreSQL sees at most 80.
      REGISTRY_CELERY_BEAT_DB_POOL_SIZE: "5"
      REGISTRY_CELERY_BEAT_DB_POOL_MAX_OVERFLOW: "10"
      REGISTRY_CELERY_BEAT_DB_POOL_RECYCLE: "1800"
      REGISTRY_CELERY_BEAT_DB_POOL_PRE_PING: "true"

  celeryWorker:
    image:
      tag: 90811b61a59f@sha256:15273f1e29b54f02df09b0bb69c5cf21d68432c1c34f0dd6521a1fbfe64b49c2
    replicaCount: 1                      # = autoscaling.celeryWorker.minReplicas
    # Measured with these CELERY_OPTS: idle ~400 Mi, peak 767 MB per pod (100-record backlog). Above 1600Mi the whole
    # container is OOM-killed (memory.oom.group=1 default) and its in-flight tasks are lost. No CPU limit.
    # NOT settable through this chart: terminationGracePeriodSeconds 720 (> the 660 s task limit), so a scale-down
    # lets running tasks finish. The subchart has no key for it; patch the Deployment after install (README.md).
    resources:
      requests: {cpu: 1500m, memory: 1Gi}
      limits: {memory: 1600Mi}
    envVars:
      REGISTRY_CELERY_WORKERS_DB_PORT: "6432"
      # DB connections per worker process: up to POOL_SIZE + MAX_OVERFLOW = 15 (values as running; same as the chart
      # defaults, recorded here). Through PgBouncer these are cheap client connections; PostgreSQL sees at most 80.
      REGISTRY_CELERY_WORKERS_DB_POOL_SIZE: "5"
      REGISTRY_CELERY_WORKERS_DB_POOL_MAX_OVERFLOW: "10"
      REGISTRY_CELERY_WORKERS_DB_POOL_RECYCLE: "1800"
      REGISTRY_CELERY_WORKERS_DB_POOL_PRE_PING: "true"
      # 4 processes (default = one per node vCPU), at most 1 reserved task each, a FRESH process per task
      # (each task module has its own event loop but shares one DB pool per process, so a reused process fails with
      # "attached to a different loop"; PgBouncer makes the per-task connect cheap), 1.5 GB RSS cap per process,
      # soft/hard time limit 600/660 s. Result: 0 OOM kills under backlog (was 115 in 9 h with 16 processes).
      CELERY_OPTS: "worker -Q registry_worker_queue --loglevel=info --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=1 --max-memory-per-child=1500000 --soft-time-limit=600 --time-limit=660"
      # The chart never enables AWE in the worker, so ingest/ODK intakes can't reach approval without these.
      REGISTRY_CELERY_WORKERS_AWE_ENABLED: "true"
      REGISTRY_CELERY_WORKERS_AWE_CALLBACK_SECRET_ID: farmer-registry
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_ID: farmer-registry-staff-portal
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_SECRET:
        secretKeyRef: {name: farmer-registry-staff-portal, key: client_secret}

  dbSeed:
    image:
      tag: 90811b61a59f@sha256:0b48d9f90be2734a131bcea08219c79cb9251307f13b422ead94f56fb7a00cd9

  sanity:
    image:
      tag: 90811b61a59f@sha256:baceebd88b20c4eefc9ed85473f1f9fe21a2ed86c9ee776da05e6ae47ed4e95d

# Autoscalers with throttling (chart templates/autoscaling.yaml). Each new staff/partner API pod runs the farmer
# startup migration (~60 s exclusive lock on g2p_register_farmers): +1 pod per minute, −1 pod per 2 min after 5 min.
# Maxima fit the 4 farmer nodes (40 vCPU). The Celery worker scales on CPU only: its slow step (duplicate check)
# waits on the database, so a growing queue may not raise CPU — queue-length scaling (KEDA) would be better.
autoscaling:
  staffApi:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    description: "Staff API: 1-5 pods at 70% of the 1500m CPU request; +1 pod/min, -1 pod/2 min after 5 min"
    behavior: &throttled
      scaleUp:
        stabilizationWindowSeconds: 60
        selectPolicy: Min
        policies: [{type: Pods, value: 1, periodSeconds: 60}]
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies: [{type: Pods, value: 1, periodSeconds: 120}]
  partnerApi:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    description: "Partner API: 1-3 pods at 70% of the 1000m CPU request; +1 pod/min, -1 pod/2 min after 5 min"
    behavior: *throttled
  celeryWorker:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    description: "Celery worker: 1-4 pods (4 processes each) at 70% of the 1500m CPU request; +1 pod/min, -1 pod/2 min after 5 min"
    behavior: *throttled

# Permanent search index + role settings for farmer_registry_user (chart templates/db-settings.yaml).
#   search by name / Farmer ID at 10 users: 1.3–1.4 s → 0.08–0.3 s (index)
#   plan_cache_mode: without it, prepared statements switch to a generic plan that uses the index for browse too
#     (ILIKE '%%' = every row): browse 1.5 → 2.4 s. With it, browse stays a table scan and search uses the index.
#   idle_in_transaction_session_timeout: a stuck request can't hold the farmers table locked (40-min outage 11-18).
#   max_parallel_workers_per_gather 0: −31% DB CPU per request at saturation (A/B 11-18).
dbSettings:
  enabled: true
  searchTrigramIndex: true
  roleSettings:
    plan_cache_mode: force_custom_plan
    idle_in_transaction_session_timeout: 60s
    max_parallel_workers_per_gather: "0"
