# openg2p-commons-base 2.3.4-rc.245 (repo openg2p = https://openg2p.github.io/openg2p-helm)
# Release `commons`, namespace `commons` → every pod lands on commons-app-01 (namespace
# node-selector, INSTALL-RUNBOOK step A). INSTALL-RUNBOOK step 10.
#
# Only the keys that differ from the chart defaults. No secrets in this file: the PostgreSQL
# superuser Secret commons/commons-postgresql is created beforehand; Keycloak's admin password is
# generated by the chart into Secret commons/commons-keycloak.
#
# In-cluster names the chart expects but which are NOT pods here (k8s/commons-aliases.yaml):
#   commons-postgresql → infra/postgres-primary → pg-primary-01 10.0.30.10:5432
#   commons-minio      → infra/minio            → minio-01      10.0.30.20:9000
global:
  baseDomain: ati-uat.oanstaging.com

# Host PostgreSQL on pg-primary-01 (design: no database inside Kubernetes). global.postgresqlHost
# and global.postgresqlSecret keep their defaults, both `commons-postgresql`.
postgresql:
  enabled: false

# MinIO runs on minio-01 (step 8), reached by browsers at https://minio.ati-uat.oanstaging.com.
minio:
  enabled: false

keycloak-init:
  staffAdminEmail: admin@ati-uat.oanstaging.com

# Kafka UI: on the environment's Istio gateway (test/internal), not the chart's per-namespace
# `internal` (which does not exist in `commons`). VPN-only — not in the RP public list.
kafkaUi:
  istio:
    virtualservice:
      gateway: test/internal
